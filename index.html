<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>洞府经营 · 云岭洞天</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1522; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #resources, #time-display, #status {
        position: fixed; left: 16px; right: 16px; padding: 11px 14px;
        border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
        background: rgba(8,14,22,.88); color: #eef3e8; font-size: 14px;
        pointer-events: none;
      }
      #resources { top: 16px; right: auto; min-width: 250px; color: #f8d477; }
      #time-display { top: 59px; right: auto; min-width: 190px; color: #b7d9ee; }
      #status { bottom: 16px; right: 310px; }
      #build-toolbar {
        position: fixed; top: 16px; right: 16px; width: min(250px, calc(100vw - 32px));
        display: grid; grid-template-columns: 1fr 1fr; gap: 7px;
      }
      #resident-panel {
        position: fixed; right: 16px; bottom: 62px; width: min(286px, calc(100vw - 32px));
        max-height: 42vh; overflow-y: auto; padding: 8px;
        border: 1px solid rgba(255,255,255,.12); border-radius: 10px;
        background: rgba(8,14,22,.9);
      }
      .resident-summary { color: #f8d477; font-size: 12px; padding: 4px 6px 8px; }
      .resident-card { padding: 8px 6px; border-bottom: 1px solid rgba(255,255,255,.1); }
      .resident-card:last-child { border-bottom: 0; }
      .resident-name { color: #eef3e8; font-size: 13px; }
      .resident-name i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
      .resident-meta, .resident-output { color: #a8b5ae; font-size: 11px; margin-top: 4px; }
      .resident-jobs { display: flex; gap: 5px; margin-top: 6px; }
      .resident-home { width: 100%; margin-top: 7px; padding: 6px; border: 1px solid rgba(255,255,255,.18); border-radius: 7px; background: #182433; color: #eef3e8; font-size: 11px; }
      button {
        border: 1px solid rgba(255,255,255,.18); border-radius: 9px;
        padding: 10px 7px; background: rgba(8,14,22,.9); color: #eef3e8;
        font-size: 13px; text-align: left;
      }
      button.active, .resident-jobs button.selected { border-color: #f8d477; background: #5d4d2e; }
      .resident-jobs button { padding: 4px 6px; font-size: 11px; }
      #cancel-button, #rotate-button, #pause-button { text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="洞府经营地图"></canvas>
    <div id="resources">粮食 120 · 材料 80 · 香火 0</div>
    <div id="time-display">第 1 天 06:00</div>
    <div id="build-toolbar">
      <button class="build-button" data-building="residence">居所 · 20材</button>
      <button class="build-button" data-building="farm">灵田 · 12材</button>
      <button class="build-button" data-building="workshop">工坊 · 28材</button>
      <button class="build-button" data-building="canteen">膳堂 · 节粮</button>
      <button class="build-button" data-building="warehouse">仓库 · 扩容</button>
      <button id="rotate-button">旋转</button>
      <button id="demolish-button">拆除</button>
      <button id="cancel-button">查看</button>
      <button id="pause-button">暂停时间</button>
      <button id="save-button">保存</button>
      <button id="reset-button">重置</button>
    </div>
    <div id="resident-panel" aria-label="仙人面板"></div>
    <div id="status">点击地图查看格子</div>
    <script type="module" src="./src/platform/web/main.js"></script>
  </body>
</html>
