<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>洞府经营 · 地图原型</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, -apple-system, sans-serif; }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0c1522; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      #status {
        position: fixed; left: 16px; right: 16px; bottom: 16px;
        padding: 11px 14px; border: 1px solid rgba(255,255,255,.12);
        border-radius: 10px; background: rgba(8,14,22,.88); color: #eef3e8;
        font-size: 14px; pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" aria-label="洞府经营地图"></canvas>
    <div id="status">点击地图查看格子</div>
    <script type="module" src="./src/platform/web/main.js"></script>
  </body>
</html>
